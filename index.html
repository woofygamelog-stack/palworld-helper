<!doctype html>
<html lang="en-US" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a31" />
    <meta name="google-site-verification" content="vcYPQJf0I03LumjZIODPdq47ZnYMCRvD2ABcBFyBImQ" />
    <meta name="google-adsense-account" content="ca-pub-1986785092914105" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => { const t = localStorage.getItem("pw-theme"); const mode = t === "light" || t === "dark" ? t : "system"; document.documentElement.dataset.theme = mode; const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches); document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#071a31" : "#edf7f5"); })();
    </script>
    <title>Palworld Helper</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
